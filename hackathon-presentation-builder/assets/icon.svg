<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1128" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Canvas Frame Gradient -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Border Stroke Gradient -->
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Gold Star Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Squircle Badge -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#334155" stroke-width="3" />
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="url(#strokeGrad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Subtle Background Grid Matrix -->
  <g opacity="0.07" stroke="#38BDF8" stroke-width="1">
    <line x1="80" y1="80" x2="432" y2="80" />
    <line x1="80" y1="160" x2="432" y2="160" />
    <line x1="80" y1="240" x2="432" y2="240" />
    <line x1="80" y1="320" x2="432" y2="320" />
    <line x1="80" y1="400" x2="432" y2="400" />
    <line x1="120" y1="60" x2="120" y2="452" />
    <line x1="200" y1="60" x2="200" y2="452" />
    <line x1="280" y1="60" x2="280" y2="452" />
    <line x1="360" y1="60" x2="360" y2="452" />
  </g>

  <!-- Presentation 16:9 Slide Canvas -->
  <rect x="76" y="120" width="360" height="240" rx="18" fill="url(#frameGrad)" stroke="url(#strokeGrad)" stroke-width="4" filter="url(#glow)" />

  <!-- Slide Header Bar -->
  <rect x="76" y="120" width="360" height="38" rx="18" fill="#1E293B" fill-opacity="0.8" />
  <circle cx="104" cy="139" r="5" fill="#EF4444" />
  <circle cx="122" cy="139" r="5" fill="#F59E0B" />
  <circle cx="140" cy="139" r="5" fill="#10B981" />

  <!-- Category Badge in Slide Header -->
  <rect x="330" y="131" width="86" height="16" rx="8" fill="#2563EB" fill-opacity="0.3" stroke="#38BDF8" stroke-width="1" />
  <line x1="344" y1="139" x2="402" y2="139" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />

  <!-- Architectural Diagram Nodes Inside Canvas -->
  <!-- Station 1: Input / Ingestion Node -->
  <g transform="translate(112, 195)">
    <rect x="0" y="0" width="60" height="70" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="2" />
    <circle cx="30" cy="24" r="10" fill="#38BDF8" fill-opacity="0.2" stroke="#38BDF8" stroke-width="2" />
    <line x1="16" y1="46" x2="44" y2="46" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
    <line x1="20" y1="54" x2="40" y2="54" stroke="#64748B" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Orthogonal Connector 1 -> 2 (Bent Connector with Arrowhead) -->
  <path d="M 172 230 L 210 230" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
  <polygon points="210,225 218,230 210,235" fill="#38BDF8" />

  <!-- Station 2: Central Neural / Core Engine Hub -->
  <g transform="translate(226, 185)">
    <circle cx="45" cy="45" r="38" fill="#0F172A" stroke="#60A5FA" stroke-width="2.5" />
    <circle cx="45" cy="45" r="24" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />
    <circle cx="45" cy="45" r="10" fill="#38BDF8" />
    <!-- Radial Satellite Dots -->
    <circle cx="45" cy="18" r="3" fill="#60A5FA" />
    <circle cx="72" cy="45" r="3" fill="#60A5FA" />
    <circle cx="45" cy="72" r="3" fill="#60A5FA" />
    <circle cx="18" cy="45" r="3" fill="#60A5FA" />
  </g>

  <!-- Orthogonal Connector 2 -> 3 -->
  <path d="M 316 230 L 344 230" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
  <polygon points="344,225 352,230 344,235" fill="#38BDF8" />

  <!-- Station 3: Multi-Tier Output / Decision Node -->
  <g transform="translate(356, 195)">
    <rect x="0" y="0" width="56" height="70" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="2" />
    <rect x="10" y="14" width="36" height="8" rx="4" fill="#10B981" />
    <rect x="10" y="28" width="36" height="8" rx="4" fill="#F59E0B" />
    <rect x="10" y="42" width="36" height="8" rx="4" fill="#EF4444" />
  </g>

  <!-- Offline Fallback Path (Dotted Loop at Bottom of Canvas) -->
  <path d="M 142 265 L 142 320 L 384 320 L 384 265" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4,4" />
  <rect x="220" y="311" width="90" height="18" rx="9" fill="#0F172A" stroke="#64748B" stroke-width="1" />
  <text x="265" y="323" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" text-anchor="middle">OFFLINE PATH</text>

  <!-- Victory Gold Star / Catalyst at Top-Right of Slide Canvas -->
  <g transform="translate(424, 108)" filter="url(#starGlow)">
    <!-- 4-Point Luminous Star -->
    <path d="M 0,-26 Q 2,-6 22,0 Q 2,6 0,26 Q -2,6 -22,0 Q -2,-6 0,-26 Z" fill="url(#goldGrad)" />
    <!-- Inner Spark Core -->
    <circle cx="0" cy="0" r="4.5" fill="#FFFFFF" />
  </g>

  <!-- Bottom Brand Title -->
  <text x="256" y="416" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="3" text-anchor="middle">HACKATHON DECK</text>
  <text x="256" y="438" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="4" text-anchor="middle">ARCHITECT</text>
</svg>
